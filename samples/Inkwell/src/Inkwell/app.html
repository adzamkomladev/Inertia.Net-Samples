<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>
      // Apply the theme before first paint. The "theme" cookie is written when preferences are saved.
      (function () {
        var m = document.cookie.match(/(?:^|; )theme=(light|dark|system)/);
        var t = m ? m[1] : 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    @inertiaHead
    @viteReactRefresh
    @vite("ClientApp/app.tsx")
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    @inertia
    <!--
      Shown inside the mount node on client-rendered pages until the app boots, so a slow phone sees the familiar
      header and reading column instead of a blank screen. Inert on server-rendered pages (a <template> never renders).
    -->
    <template id="app-shell">
      <div aria-hidden="true" class="flex min-h-screen flex-col">
        <div class="sticky top-0 border-b bg-background/85">
          <div class="mx-auto flex h-14 w-full max-w-5xl items-center gap-2 px-4 sm:px-6 lg:h-16">
            <span class="mr-4 font-serif text-[1.65rem] leading-none font-semibold tracking-[-0.03em]">Inkwell</span>
            <div class="ml-auto flex items-center gap-2">
              <span class="hidden h-9 w-56 rounded-full bg-muted lg:block"></span>
              <span class="size-8 rounded-full bg-muted"></span>
            </div>
          </div>
        </div>
        <div class="mx-auto w-full max-w-[44rem] flex-1 animate-pulse px-4 pt-8 sm:px-6 lg:pt-14">
          <div class="h-9 w-2/3 rounded-md bg-muted"></div>
          <div class="mt-3 h-4 w-1/2 rounded bg-muted"></div>
          <div class="mt-10 space-y-8 border-t pt-8">
            <div class="space-y-3"><div class="h-3.5 w-40 rounded bg-muted"></div><div class="h-6 w-4/5 rounded bg-muted"></div><div class="h-3.5 w-full rounded bg-muted"></div></div>
            <div class="space-y-3"><div class="h-3.5 w-32 rounded bg-muted"></div><div class="h-6 w-3/5 rounded bg-muted"></div><div class="h-3.5 w-11/12 rounded bg-muted"></div></div>
          </div>
        </div>
        <div class="fixed inset-x-0 bottom-0 h-[calc(3.5rem+env(safe-area-inset-bottom))] border-t bg-background/92 lg:hidden"></div>
      </div>
    </template>
  </body>
</html>
