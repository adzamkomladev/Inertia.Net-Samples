# Production stack for a VPS, Coolify or Dokploy. See docs/DEPLOY.md.
# No host port is published here (the platform's proxy routes to 8080); docker-compose.override.yml publishes one
# for plain `docker compose up` on your own machine or VPS.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      APP_NAME: ${APP_NAME:-Inkwell}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      ANALYTICS_SALT: ${ANALYTICS_SALT:?set a long random value}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      STORAGE_FORCED_PATH_STYLE: ${STORAGE_FORCED_PATH_STYLE:-true}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@example.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Inkwell}
      CRON_ENABLED: ${CRON_ENABLED:-true}
    volumes:
      - app-data:/data

volumes:
  app-data:
