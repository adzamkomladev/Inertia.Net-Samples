# Optional search only; Redis is already a required service in the base stack.
services:
  meilisearch:
    image: getmeili/meilisearch:v1.16
    profiles: [search]
    environment:
      MEILI_MASTER_KEY: ${LOCAL_MEILISEARCH_KEY:-local-demo-search-key}
    ports:
      - "127.0.0.1:${LOCAL_MEILISEARCH_PORT:-7713}:7700"
    volumes:
      - meili-data:/meili_data
volumes:
  meili-data:
