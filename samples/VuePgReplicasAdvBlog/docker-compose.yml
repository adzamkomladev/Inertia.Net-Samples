name: vuepgreplicasadvblog

x-host: &host
  env_file:
    - path: .env
      required: false
  environment: &environment
    DATA_DIR: /data
    APP_BASE_URL: ${APP_BASE_URL_DOCKER:-http://localhost:8183}
    App__BaseUrl: ${APP_BASE_URL_DOCKER:-http://localhost:8183}
    DATABASE_URL: "Host=postgres;Database=${POSTGRES_DB:-vue_pg_replicas_adv_blog};Username=${POSTGRES_USER:-vue_pg_replicas_adv_blog};Password=${POSTGRES_PASSWORD:-local-dev-password}"
    REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379}
    Replicas__Namespace: ${REPLICA_NAMESPACE:-VuePgReplicasAdvBlog:production}
    Database__MigrateOnStartup: "false"
    Auth__SecureCookies: ${SECURE_COOKIES:-false}
    ANALYTICS_SALT: ${ANALYTICS_SALT:-local-dev-salt}

x-running: &running
  <<: *host
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  migrate:
    <<: *host
    image: vuepgreplicasadvblog-mainapp:local
    build:
      context: .
      target: mainapp
    command: [--migrate]
    environment:
      <<: *environment
      Replicas__Enabled: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    <<: *running
    image: vuepgreplicasadvblog-mainapp:local
    build:
      context: .
      target: mainapp
    deploy:
      replicas: 3

  worker:
    <<: *running
    image: vuepgreplicasadvblog-worker:local
    build:
      context: .
      target: worker
    deploy:
      replicas: 2
    volumes:
      - worker-data:/data
    healthcheck:
      test: [CMD-SHELL, "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  realtime:
    <<: *running
    image: vuepgreplicasadvblog-realtime:local
    build:
      context: .
      target: realtime
    deploy:
      replicas: 2

  proxy:
    image: haproxy:3.2-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8183}:8080"
    volumes:
      - ./docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      app:
        condition: service_healthy
      realtime:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5441}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vue_pg_replicas_adv_blog}
      POSTGRES_USER: ${POSTGRES_USER:-vue_pg_replicas_adv_blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6387}:6379"
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  worker-data:
