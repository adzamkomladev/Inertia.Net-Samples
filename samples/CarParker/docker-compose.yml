# Production stack for a VPS, Coolify or Dokploy: the app plus a single-node MongoDB replica set (transactions need
# one). See docs/DEPLOY.md. No host ports here; docker-compose.override.yml publishes one for plain `docker compose up`.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      APP_NAME: ${APP_NAME:-CarParker}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      ANALYTICS_SALT: ${ANALYTICS_SALT:?set a long random value}
      MONGO_MODE: ${MONGO_MODE:-replica}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-mongodb://mongo:27017/?replicaSet=rs0}
      DATABASE_NAME: ${DATABASE_NAME:-carparker}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      STORAGE_FORCED_PATH_STYLE: ${STORAGE_FORCED_PATH_STYLE:-true}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CarParker}
      CRON_ENABLED: ${CRON_ENABLED:-true}
    volumes:
      - app-data:/data
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:9
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    # Initiates the replica set on first boot, then reports healthy once it is up.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}).ok }' | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  app-data:
  mongo-data:
