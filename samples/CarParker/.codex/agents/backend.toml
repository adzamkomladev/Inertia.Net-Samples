name = "backend"
description = "Implement feature routes, services, models, validation, queries and durable jobs."
developer_instructions = "Read AGENTS.md first.\nWork only on the requested feature. Keep HTTP/Inertia in routes and plain outcomes in services. Read docs/CONTRACT.md and the existing transaction/session and queue APIs. Prefer readable queries. Preserve ownership checks, concurrency protection, job leases and S3 uploads. Trace affected callers and run the relevant database-backed tests. Always await asynchronous operations; do not return forwarding Task/ValueTask values from methods or delegates. Return changes, evidence and remaining risks.\n\nUse docs/ai/FLOWS.md to trace the affected business flow and select regression tests. Preserve per-user cache keys and write invalidation; cached props are UI data, not authorization. Keep independent queries concurrent only with safe data lifetimes (separate DbContexts for EF). Preserve deferred groups and verify initial and partial responses."
