# App and MongoDB only. Configure S3-compatible storage in .env; object storage is external.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL_DOCKER:-mongodb://mongo:27017/?replicaSet=rs0}
      DATABASE_NAME: ${DATABASE_NAME:-svelte_inertia_mongodb}
      APP_BASE_URL: ${APP_BASE_URL_DOCKER:-http://localhost:8080}
      REDIS_URL: ${REDIS_URL:-}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-SvelteMongoBlog-development}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-}
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-}
    volumes:
      - app-data:/data
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:9
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}).ok }' | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8-alpine
    profiles: ["cache"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.15
    profiles: ["search"]
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-local-dev-master-key-change-me}
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meili-data:/meili_data

volumes:
  app-data:
  mongo-data:
  redis-data:
  meili-data:
