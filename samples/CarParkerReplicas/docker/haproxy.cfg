global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 120s
    timeout server 120s
    timeout tunnel 1h

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold obsolete 2s

frontend public
    bind :8080
    # Overwrite untrusted forwarded headers. The local entry point is HTTP; a TLS terminator in
    # front of HAProxy should set the public scheme and APP_BASE_URL/AUTH_SECURE_COOKIES accordingly.
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto http
    http-request del-header X-Forwarded-Host
    default_backend replicas

backend replicas
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    # SignalR negotiation, long polling and the Inertia state/antiforgery flow require the browser to
    # return to the same replica. The backplane distributes messages but does not replace affinity.
    cookie CPR_REPLICA insert indirect nocache httponly dynamic
    dynamic-cookie-key CarParkerReplicas
    http-response set-header X-Replica %[srv_name]
    server-template app 1-10 app:8080 check resolvers docker init-addr libc,none resolve-prefer ipv4
