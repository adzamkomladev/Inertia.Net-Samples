# PostgreSQL-backed app on http://localhost:8080. S3-compatible storage is external via .env.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      APP_BASE_URL: ${APP_BASE_URL_DOCKER:-http://localhost:8080}
      DATABASE_URL: "Host=postgres;Database=${POSTGRES_DB:-vue_inertia};Username=${POSTGRES_USER:-vue_inertia};Password=${POSTGRES_PASSWORD:-local-dev-password}"
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      ANALYTICS_SALT: ${ANALYTICS_SALT:-local-dev-salt}
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vue_inertia}
      POSTGRES_USER: ${POSTGRES_USER:-vue_inertia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app-data:
  postgres-data:
