# Production stack for a VPS, Coolify or Dokploy: the app plus PostgreSQL 18. See docs/DEPLOY.md.
# No host ports here; docker-compose.override.yml publishes one for plain `docker compose up`.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      APP_NAME: ${APP_NAME:-TechLandier}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      ANALYTICS_SALT: ${ANALYTICS_SALT:?set a long random value}
      DATABASE_URL: postgresql://${POSTGRES_USER:-techlandier}:${POSTGRES_PASSWORD:?set a database password}@postgres:5432/${POSTGRES_DB:-techlandier}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      STORAGE_FORCED_PATH_STYLE: ${STORAGE_FORCED_PATH_STYLE:-true}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-TechLandier}
      CRON_ENABLED: ${CRON_ENABLED:-true}
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techlandier}
      POSTGRES_USER: ${POSTGRES_USER:-techlandier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a database password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app-data:
  postgres-data:
