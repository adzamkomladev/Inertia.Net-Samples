<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Inline script to detect system dark mode preference and apply it immediately -->
  <script>
    (function () {
      var appearance = localStorage.getItem('appearance') || 'system';
      if (appearance === 'system') {
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark) document.documentElement.classList.add('dark');
      } else if (appearance === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- Inline style to set the HTML background color based on our theme in app.css -->
  <style>
    html { background-color: hsl(0 0% 100%); }
    html.dark { background-color: hsl(0 0% 3.9%); }
  </style>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Inertia.js Demo App">
  <meta property="og:description" content="A comprehensive Inertia.js 3.0 kitchen sink app built with .NET and Vue, featuring a mini CRM and feature showcase pages.">
  <meta property="og:image" content="/images/og-image.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@inertiajs">
  <meta name="twitter:creator" content="@inertiajs">
  <meta name="twitter:title" content="Inertia.js Demo App">
  <meta name="twitter:description" content="A comprehensive Inertia.js 3.0 kitchen sink app built with .NET and Vue, featuring a mini CRM and feature showcase pages.">
  <meta name="twitter:image" content="/images/og-image.png">

  @inertiaHead
  @vite("ClientApp/app.ts")
</head>
<body class="font-sans antialiased">
  @inertia
</body>
</html>
