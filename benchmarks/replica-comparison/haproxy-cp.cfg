global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 120s
    timeout server 120s
    timeout tunnel 1h

frontend public
    bind :8080
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto http
    default_backend app

backend app
    balance roundrobin
    option httpchk GET /alive
    http-check expect status 200
    cookie CPR_REPLICA insert indirect nocache httponly dynamic
    dynamic-cookie-key CarParkerReplicas
    http-response set-header X-Replica %[srv_name]
    server app1 host.docker.internal:8201 check
    server app2 host.docker.internal:8202 check
    server app3 host.docker.internal:8203 check
