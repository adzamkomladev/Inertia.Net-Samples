global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 120s
    timeout server 120s
    timeout tunnel 1h

frontend public
    bind :8080
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto http
    acl realtime_path path -i /realtime
    acl realtime_child path_beg -i /realtime/
    use_backend realtime if realtime_path or realtime_child
    default_backend mainapp

backend mainapp
    balance roundrobin
    option httpchk GET /alive
    http-check expect status 200
    cookie TLD_REPLICA insert indirect nocache httponly dynamic
    dynamic-cookie-key TechLandierDistributed
    http-response set-header X-Replica %[srv_name]
    server app1 host.docker.internal:8401 check
    server app2 host.docker.internal:8402 check
    server app3 host.docker.internal:8403 check

backend realtime
    balance roundrobin
    option httpchk GET /alive
    http-check expect status 200
    cookie TLD_REALTIME insert indirect nocache httponly dynamic
    dynamic-cookie-key TechLandierDistributedRealtime
    http-response set-header X-Realtime-Replica %[srv_name]
    server realtime1 host.docker.internal:8404 check
